name: tests

# Evidencia independiente de que la suite pasa. Antes de esto, cualquier
# afirmacion de "N pruebas verdes" era un resultado local reportado, imposible
# de verificar por un auditor externo.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 es el piso soportado; 3.13 adelanta roturas por version antes
        # de que Render mueva su runtime por debajo del servicio.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Se invoca como "python -m pytest", NO como "pytest" a secas. Las
      # pruebas importan el modulo con "import app", y solo el -m pone el
      # directorio del repo en sys.path. Con "pytest" pelado, la recoleccion
      # revienta con ModuleNotFoundError. No simplificar esta linea.
      - name: Correr pruebas
        run: python -m pytest tests -q
