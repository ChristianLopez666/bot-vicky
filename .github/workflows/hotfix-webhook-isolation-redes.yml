name: Redes webhook isolation hotfix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotfix-webhook-isolation-redes.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Aplicar guardia phone_number_id
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app.py")
          src = path.read_text(encoding="utf-8")
          old = '''            for chg in entry.get("changes", []):\n                value = chg.get("value") or {}\n                for msg in value.get("messages", []):\n                    handle(msg)\n                # Bucle hermano, no alternativo: un webhook mixto trae messages[]\n                # y statuses[] a la vez y ambos deben procesarse. Hasta ahora la\n                # clave `statuses` simplemente no se leia nunca.\n                _handle_statuses(value.get("statuses", []))\n'''
          new = '''            for chg in entry.get("changes", []):\n                value = chg.get("value") or {}\n                metadata = value.get("metadata") or {}\n                incoming_phone_id = str(metadata.get("phone_number_id") or "").strip()\n\n                # Meta suscribe webhooks a nivel WABA: este servicio puede\n                # recibir eventos de SECOM, Rodys u otros numeros de la misma\n                # cuenta. Redes solo procesa su propio phone_number_id.\n                if WABA_ID:\n                    if incoming_phone_id and incoming_phone_id != WABA_ID:\n                        log.info(\n                            "🧱 Webhook descartado por phone_number_id ajeno: recibido=%s esperado=%s",\n                            incoming_phone_id, WABA_ID,\n                        )\n                        continue\n                else:\n                    # Fallback legacy: evita dejar mudo el bot, pero hace visible\n                    # como ERROR que el aislamiento no esta operativo.\n                    log.error(\n                        "❌ WABA_PHONE_ID no configurado: aislamiento webhook degradado; "\n                        "procesando evento en modo legacy"\n                    )\n\n                if not incoming_phone_id:\n                    log.warning(\n                        "⚠️ Webhook sin metadata.phone_number_id; procesando por compatibilidad"\n                    )\n\n                for msg in value.get("messages", []):\n                    handle(msg)\n                # Statuses ajenos se descartan por la misma guardia ANTES de\n                # llegar aqui; nunca deben activar reintentos ni efectos de Redes.\n                _handle_statuses(value.get("statuses", []))\n'''
          if "Webhook descartado por phone_number_id ajeno" not in src:
              if old not in src:
                  raise SystemExit("BLOQUE_OBJETIVO_NO_ENCONTRADO")
              src = src.replace(old, new, 1)
              path.write_text(src, encoding="utf-8")
          PY

      - name: Verificar sintaxis
        run: python -m py_compile app.py

      - name: Probar aislamiento Redes
        shell: bash
        env:
          WABA_PHONE_ID: "702222712983984"
          META_APP_SECRET: "test-secret"
          BOARDROOM_API_TOKEN: ""
          BUS_ENABLED: "false"
        run: |
          python - <<'PY'
          import hashlib
          import hmac
          import json
          import app

          handled = []
          statuses_seen = []
          app.handle = lambda msg: handled.append(msg)
          app._handle_statuses = lambda statuses: statuses_seen.extend(statuses or [])
          client = app.app.test_client()
          secret = b"test-secret"

          def post(payload):
              raw = json.dumps(payload, separators=(",", ":")).encode()
              sig = "sha256=" + hmac.new(secret, raw, hashlib.sha256).hexdigest()
              return client.post(
                  "/webhook",
                  data=raw,
                  content_type="application/json",
                  headers={"X-Hub-Signature-256": sig},
              )

          def payload(phone_id, mid):
              return {"entry": [{"changes": [{"value": {
                  "metadata": {"phone_number_id": phone_id},
                  "messages": [{"from": "5216681620521", "id": mid, "type": "text", "text": {"body": "vida"}}],
                  "statuses": [{"id": "status-" + mid, "status": "delivered", "recipient_id": "5216681620521"}],
              }}]}]}

          assert post(payload("1045543821971905", "secom")).status_code == 200
          assert handled == [] and statuses_seen == []

          assert post(payload("876953768824165", "rodys")).status_code == 200
          assert handled == [] and statuses_seen == []

          assert post(payload("702222712983984", "redes")).status_code == 200
          assert [m["id"] for m in handled] == ["redes"]
          assert [s["id"] for s in statuses_seen] == ["status-redes"]

          mixed = {"entry": [{"changes": [
              {"value": {"metadata": {"phone_number_id": "1045543821971905"}, "messages": [{"from": "x", "id": "foreign", "type": "text", "text": {"body": "hola"}}]}},
              {"value": {"metadata": {"phone_number_id": "702222712983984"}, "messages": [{"from": "y", "id": "own", "type": "text", "text": {"body": "hola"}}]}},
          ]}]}
          assert post(mixed).status_code == 200
          assert [m["id"] for m in handled] == ["redes", "own"]
          print("Redes isolation tests: OK")
          PY

      - name: Ejecutar regresion disponible
        run: python -m pytest tests -q --ignore=tests/test_cierre_cortesia_post_propuesta.py

      - name: Commit de la correccion y limpieza del workflow temporal
        shell: bash
        run: |
          git config user.name "ChatGPT Webhook Isolation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/hotfix-webhook-isolation-redes.yml
          git add app.py
          git commit -m "fix(redes): aislar webhook por phone_number_id"
          git push origin main
